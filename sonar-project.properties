sonar.projectKey=incident-tracker
sonar.projectName=Security Incident Tracker
sonar.sources=src
sonar.tests=tests
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.eslint.reportPaths=reports/eslint.json
sonar.exclusions=**/node_modules/**,coverage/**,reports/**,dist/**
sonar.coverage.exclusions=src/server.js
sonar.cpd.exclusions=tests/**
# Make the scanner wait for the Quality Gate result and FAIL the build if it fails
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300