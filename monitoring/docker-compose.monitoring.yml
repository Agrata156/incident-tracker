name: monitoring

services:
  prometheus:
    build: ./prometheus
    image: incident-prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - devops-net

  alertmanager:
    build: ./alertmanager
    image: incident-alertmanager:latest
    container_name: alertmanager
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    ports:
      - "9093:9093"
    restart: unless-stopped
    networks:
      - devops-net

  grafana:
    build: ./grafana
    image: incident-grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3030:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - devops-net

volumes:
  prometheus-data:
  grafana-data:

networks:
  devops-net:
    external: true
