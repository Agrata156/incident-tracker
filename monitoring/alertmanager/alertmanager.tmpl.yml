route:
  receiver: discord
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: discord
    discord_configs:
      - webhook_url: "__DISCORD_WEBHOOK_URL__"
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🚨 FIRING{{ else }}✅ RESOLVED{{ end }}: {{ .CommonLabels.alertname }}'
        message: '{{ range .Alerts }}**{{ .Annotations.summary }}**{{ "\n" }}{{ if eq .Status "firing" }}{{ .Annotations.description }}{{ else }}Back to normal.{{ end }}{{ "\n" }}{{ end }}'