groups:
  - name: incident-tracker-production
    rules:
      - alert: IncidentTrackerDown
        expr: up{job="incident-tracker-prod"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Incident Tracker (production) is DOWN"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for more than 30 seconds."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="incident-tracker-prod", status=~"5.."}[2m]))
            / clamp_min(sum(rate(http_requests_total{job="incident-tracker-prod"}[2m])), 0.001) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of production requests are failing (5xx)"
          description: "Current 5xx error ratio is {{ $value | humanizePercentage }}."

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="incident-tracker-prod"}[5m]))) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Production p95 latency is above 500ms"
          description: "p95 response time is {{ $value | humanizeDuration }}."

      - alert: PossibleBruteForceLogin
        expr: |
          sum(increase(http_requests_total{job="incident-tracker-prod", route=~"/api/auth.*", status=~"401|429"}[1m])) > 10
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Possible brute-force attack on the login endpoint"
          description: "{{ $value | humanize }} failed or rate-limited login attempts in the last minute."

      - alert: CriticalIncidentBacklog
        expr: sum(incidents_open{job="incident-tracker-prod", severity="Critical"}) > 3
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "More than 3 unresolved CRITICAL security incidents"
          description: "There are {{ $value }} open critical incidents - escalate to the security lead."
